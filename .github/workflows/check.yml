name: Source checks
on: [push, pull_request]
jobs:
  python-and-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s desktop -p test_designer.py -v
      - run: python scripts/Test-Images.py
      - run: python scripts/Verify-Images.py dist/M6_Reborn.uf2
      - run: python -m compileall -q desktop scripts
